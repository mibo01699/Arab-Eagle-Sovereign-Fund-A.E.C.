name: Arab Eagle Sovereign Fund Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  administrative-audit:
    name: التدقيق الإداري والمالي السيادي
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Clear Cache & Install Dependencies
      run: |
        npm rm -rf node_modules package-lock.json
        npm install --legacy-peer-deps || npm install

    - name: Run Web3 Pre-Compliance Test
      run: |
        if [ -f "InstallmentTest.js" ]; then
          node InstallmentTest.js
        else
          echo "Warning: InstallmentTest.js not found in root, bypassing strict check."
        fi
