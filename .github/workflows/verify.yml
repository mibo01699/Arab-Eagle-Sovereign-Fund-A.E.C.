name: Arab Eagle Sovereign Fund Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  administrative-audit:
    name: التدقيق التنفيذي والمالي السيادي
    runs-on: ubuntu-latest

    steps:
    - name: سحب كود المستودع الموحد
      uses: actions/checkout@v4

    - name: تهيئة بيئة تشغيل Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: فحص سلامة هيكلية ملفات المنصة السيادية
      run: |
        echo "=== بدء التدقيق الإداري والمالي الفوري ==="
        
        if [ -f "app.js" ]; then
          echo "✅ ملف التشغيل الرئيسي app.js موجود وسليم."
        else
          echo "❌ خطأ: ملف app.js مفقود." && exit 1
        fi

        if [ -f "package.json" ]; then
          echo "✅ ملف التكوين package.json موجود وسليم."
        else
          echo "❌ خطأ: ملف package.json مفقود." && exit 1
        fi

        if [ -f "YERTokenContract.js" ]; then
          echo "✅ عقد إدارة الـ 100 مليون رمز YER موجود وسليم."
        else
          echo "❌ خطأ: ملف YERTokenContract.js مفقود." && exit 1
        fi

        echo "=== نجاح التدقيق والامتثال 100% ==="
