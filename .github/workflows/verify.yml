name: Arab Eagle Sovereign Fund Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  administrative-audit:
    name: التدقيق الإداري والمالي السيادي
    runs-on: ubuntu-latest

    steps:
    - name: سحب كود المستودع الموحد
      uses: actions/checkout@v4

    - name: تهيئة بيئة تشغيل Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20'
        cache: 'npm'

    - name: تثبيت الحزم الصارمة للمنصة
      run: npm ci || npm install

    - name: تشغيل اختبارات المقاصة والـ BigInt لمنع الهدر
      run: npm test
